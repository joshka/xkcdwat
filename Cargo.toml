[package]
name = "xkcdwat"
description = "Add xkcd image alt text to its RSS feed"
version = "0.1.0"
edition = "2021"

[lib]
# Workers loads the Wasm artifact; the native library also lets cargo test exercise feed logic.
crate-type = ["cdylib", "rlib"]

[dependencies]
pulldown-cmark = "0.13"
regex = "1"
worker = "0.8"

# Reduce the Wasm bundle uploaded to Workers.
[profile.release]
lto = true
# wasm-bindgen needs metadata removed by full symbol stripping.
strip = "debuginfo"
codegen-units = 1
