name: CI

# GitHub checks Rust code and the deployable Wasm bundle. Deployment belongs to the separately
# configured Cloudflare Workers Builds integration, so this workflow needs no Cloudflare credential.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The chosen rustfmt layout needs nightly; production compilation still uses stable.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt -- --check

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install the Rust Worker builder
        run: cargo install worker-build --version '^0.8' --locked
      # Native tests cannot verify the Wasm bundle or Wrangler configuration; a dry run checks both.
      - run: npm run check:deploy
      - run: npm test
